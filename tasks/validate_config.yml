---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "couchdb_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }

- name: Fail if required CouchDB settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - couchdb_uid
    - couchdb_gid
    - couchdb_container_network

# CouchDB 3.x removed "Admin Party" mode and its container image refuses to
# start ("ERROR: CouchDB 3.0+ will no longer run in Admin Party mode") unless
# an `[admins]` entry exists in one of its configuration files. The role can
# supply one in two ways: via the `COUCHDB_USER`/`COUCHDB_PASSWORD` pair in the
# environment file (which the image's entrypoint only honors when *both* are
# non-empty), or via `couchdb_admins` in local.ini.
#
# Without either, the container exits with status 1 on every start. Because the
# systemd service uses `Restart=always`, systemd keeps the unit in the `active`
# state while it restarts, so the failure is easy to miss.
- name: Fail if no CouchDB administrator account is configured
  ansible.builtin.fail:
    msg: >-
      You need to define an administrator account for CouchDB, either by
      setting both `couchdb_root_username` and `couchdb_root_password`, or by
      listing administrators in `couchdb_admins_custom`. CouchDB 3.x refuses to
      start without one.
  when: "(couchdb_root_username | string | length == 0 or couchdb_root_password | string | length == 0) and couchdb_admins | length == 0"

- name: Run if Traefik is enabled
  when: couchdb_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for CouchDB are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item.name }}`).
      when: "item.when | bool and lookup('vars', item.name, default='') | string | length == 0"
      with_items:
        - { "name": "couchdb_container_labels_traefik_hostname", when: true }
        - { "name": "couchdb_container_labels_traefik_path_prefix", when: true }
        - { "name": "couchdb_container_labels_traefik_middleware_basic_auth_users", when: "{{ couchdb_container_labels_traefik_middleware_basic_auth_enabled }}" }

    - name: Fail if couchdb_container_labels_traefik_path_prefix is different than /
      ansible.builtin.fail:
        msg: >-
          couchdb_container_labels_traefik_path_prefix (`{{ couchdb_container_labels_traefik_path_prefix }}`) must be `/`.
          CouchDB does not support hosting under a subpath yet.
      when: "couchdb_container_labels_traefik_path_prefix != '/'"

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `couchdb_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if couchdb_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          couchdb_container_labels_traefik_path_prefix (`{{ couchdb_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/couchdb`).
      when: "couchdb_container_labels_traefik_path_prefix != '/' and couchdb_container_labels_traefik_path_prefix[-1] == '/'"
