---
# Including the role runs tasks/main.yml in full, which means the
# `create-user-couchdb` block runs here too: tags only narrow a run down when
# `--tags` is passed, and Molecule passes none. tasks/create_user.yml is
# therefore covered, which matters because its user-creation task carries both
# `no_log: true` and `ignore_errors: true` - a failure there is invisible in
# the output, and only verify.yml can catch it.
- name: Include roles for CouchDB Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Include roles for CouchDB Molecule tests
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      loop_control:
        loop_var: role_name

- name: Ensure CouchDB service is started
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure systemd daemon is reloaded
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Ensure CouchDB systemd service is started
      ansible.builtin.systemd_service:
        name: couchdb.service
        state: started
